<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="ai-comparison-t ai-comparison-d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="ai-comparison-t">AI policy comparison</title>
<desc id="ai-comparison-d">Text from two policy PDFs is extracted, filtered by keyword and capped at 25,000 characters each, then sent to the Claude API. Valid reports are saved; errors are logged and shown and nothing is saved.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 9 4, 0 8" fill="#bfc0c0"/></marker></defs>
<rect width="100%" height="100%" rx="8" fill="#2d3142"/>
<path d="M 216,64 L 264,64" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 456,64 L 504,64" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 696,64 L 744,64" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 840,104 L 840,184" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 744,224 L 640,224" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 416,224 L 384,224" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="400" y="214" text-anchor="middle" font-size="12" fill="#b4bccb">yes</text>
<path d="M 288,264 L 288,344" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 528,288 L 528,344" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="548" y="320" text-anchor="middle" font-size="12" fill="#b4bccb">no</text>
<path d="M 360,104 L 360,128 Q 360,136 368,136 L 664,136 Q 672,136 672,144 L 672,376 Q 672,384 664,384 L 624,384" fill="none" stroke="#bfc0c0" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="440" y="128" text-anchor="middle" font-size="12" fill="#b4bccb">extraction error</text>
<rect x="24" y="24" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="120.0" y="53" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Two policy PDFs</text><text x="120.0" y="70" text-anchor="middle" font-size="12" fill="#bfc0c0">current policy</text><text x="120.0" y="86" text-anchor="middle" font-size="12" fill="#bfc0c0">and proposal</text>
<rect x="264" y="24" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="360.0" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Extract text</text><text x="360.0" y="78" text-anchor="middle" font-size="12" fill="#bfc0c0">PHP PDF parser</text>
<rect x="504" y="24" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="600.0" y="53" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Keyword filter</text><text x="600.0" y="70" text-anchor="middle" font-size="12" fill="#bfc0c0">coverage and price,</text><text x="600.0" y="86" text-anchor="middle" font-size="12" fill="#bfc0c0">plus 1 block each side</text>
<rect x="744" y="24" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="840.0" y="53" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Limit</text><text x="840.0" y="70" text-anchor="middle" font-size="12" fill="#bfc0c0">25,000 characters</text><text x="840.0" y="86" text-anchor="middle" font-size="12" fill="#bfc0c0">per PDF</text>
<rect x="744" y="184" width="192" height="80" rx="6" fill="#393e53" stroke="#82aaea" stroke-width="1.2" stroke-dasharray="5 4"/><text x="840.0" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Claude API</text><text x="840.0" y="230" text-anchor="middle" font-size="12" fill="#bfc0c0">fixed report prompt,</text><text x="840.0" y="246" text-anchor="middle" font-size="12" fill="#bfc0c0">120 s timeout</text>
<polygon points="528,160 640,224 528,288 416,224" fill="#393e53" stroke="#f08a59" stroke-width="2"/><text x="528" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5">Complete</text><text x="528" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5">response?</text>
<rect x="192" y="184" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="288.0" y="213" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Save report</text><text x="288.0" y="230" text-anchor="middle" font-size="12" fill="#bfc0c0">Markdown and date</text><text x="288.0" y="246" text-anchor="middle" font-size="12" fill="#bfc0c0">on the policy</text>
<rect x="192" y="344" width="192" height="80" rx="20" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="288.0" y="373" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Policy tab</text><text x="288.0" y="390" text-anchor="middle" font-size="12" fill="#bfc0c0">agent can regenerate</text><text x="288.0" y="406" text-anchor="middle" font-size="12" fill="#bfc0c0">or delete the report</text>
<rect x="432" y="344" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="528.0" y="373" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Error</text><text x="528.0" y="390" text-anchor="middle" font-size="12" fill="#bfc0c0">logged and shown,</text><text x="528.0" y="406" text-anchor="middle" font-size="12" fill="#bfc0c0">nothing saved</text>
<text x="24" y="480" font-size="12" fill="#b4bccb">Error cases: missing PDF or API key, no extractable text, failed HTTP call, empty answer, answer cut at the token limit.</text>
<text x="24" y="502" font-size="12" fill="#b4bccb">If no keyword matches, the first 25,000 characters are sent.</text>
</svg>
