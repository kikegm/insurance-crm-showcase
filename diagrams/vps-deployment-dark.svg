<rect x="624" y="248" width="136" height="72" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="692.0" y="273" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Cron</text><text x="692.0" y="290" text-anchor="middle" font-size="12" fill="#bfc0c0">Laravel scheduler,</text><text x="692.0" y="306" text-anchor="middle" font-size="12" fill="#bfc0c0">dynamic DNS</text>
<rect x="800" y="248" width="96" height="72" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="848.0" y="289" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Backups</text>
<rect x="416" y="376" width="152" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="492.0" y="405" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Manual deploy</text><text x="492.0" y="422" text-anchor="middle" font-size="12" fill="#bfc0c0">git pull, composer,</text><text x="492.0" y="438" text-anchor="middle" font-size="12" fill="#bfc0c0">build, migrate</text>
<rect x="624" y="376" width="136" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="692.0" y="413" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Supervisor</text><text x="692.0" y="430" text-anchor="middle" font-size="12" fill="#bfc0c0">queue:work</text>
