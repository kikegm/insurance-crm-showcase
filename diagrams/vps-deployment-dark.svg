<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" width="960" height="528" role="img" aria-labelledby="vps-deployment-t vps-deployment-d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="vps-deployment-t">VPS deployment</title>
<desc id="vps-deployment-d">The agent&#x27;s browser reached nginx over HTTPS through the server firewall. nginx passed requests to PHP-FPM running the Laravel app, which used a MySQL server on the same machine. Supervisor kept a queue worker running, certbot renewed the certificate, cron ran the Laravel scheduler and updated dynamic DNS, and there were backups. The owner deployed over SSH.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 9 4, 0 8" fill="#bfc0c0"/></marker></defs>
<rect width="100%" height="100%" rx="8" fill="#2d3142"/>
<rect x="208" y="24" width="728" height="480" rx="8" fill="#333850" stroke="#8791a6" stroke-width="1" stroke-dasharray="4 3"/><text x="224" y="46" font-size="12" font-weight="600" fill="#b4bccb">Self-managed VPS, Ubuntu 24.04</text>
<path d="M 160,132 L 240,132" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="183" y="122" text-anchor="middle" font-size="12" fill="#b4bccb">HTTPS</text>
<path d="M 160,416 L 240,416" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="183" y="406" text-anchor="middle" font-size="12" fill="#b4bccb">SSH</text>
<path d="M 352,132 L 432,132" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 352,416 L 416,416" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 568,132 L 624,132" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 760,132 L 800,132" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path d="M 500,248 L 500,168" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="526" y="212" text-anchor="middle" font-size="12" fill="#b4bccb">renews</text>
<path d="M 692,248 L 692,216 Q 692,208 700,208 L 840,208 Q 848,208 848,200 L 848,168" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="770" y="200" text-anchor="middle" font-size="12" fill="#b4bccb">schedules calls</text>
<path d="M 568,416 L 624,416" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="594" y="406" text-anchor="middle" font-size="12" fill="#b4bccb">restart</text>
<path d="M 760,416 L 908,416 Q 916,416 916,408 L 916,140 Q 916,132 908,132 L 896,132" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="838" y="406" text-anchor="middle" font-size="12" fill="#b4bccb">BORME searches</text>
