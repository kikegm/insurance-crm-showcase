<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" width="960" height="608" role="img" aria-labelledby="architecture-t architecture-d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="architecture-t">Insurance CRM architecture</title>
<desc id="architecture-d">A browser talks to Livewire pages in a Laravel app. The app runs queued searches and Artisan commands, calls boe.es, datoscif.es and the Claude API, and stores data in MySQL and PDFs on a private disk.</desc>
