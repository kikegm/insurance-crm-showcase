<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="borme-to-call-t borme-to-call-d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="borme-to-call-t">From a BORME notice to a scheduled call</title>
<desc id="borme-to-call-d">A search runs as a queued job over business days, downloads PDFs, extracts and filters notices, stores companies, and a daily command schedules a call when a company reaches ten months.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><polygon points="0 0, 9 4, 0 8" fill="#bfc0c0"/></marker></defs>
<rect width="100%" height="100%" rx="8" fill="#2d3142"/>
<path d="M 216,64 L 264,64" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 264,208 L 216,208" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 456,64 L 504,64" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 504,208 L 456,208" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 696,64 L 744,64" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 744,208 L 696,208" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 840,104 L 840,168" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 120,248 L 120,344" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 216,384 L 256,384" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 512,384 L 600,384" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="554" y="374" text-anchor="middle" font-size="12" fill="#b4bccb">yes</text>
<path d="M 752,384 L 800,384" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M 384,460 L 384,496" fill="none" stroke="#bfc0c0" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="404" y="482" text-anchor="middle" font-size="12" fill="#b4bccb">no</text>
<rect x="24" y="24" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="120.0" y="53" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Search form</text><text x="120.0" y="70" text-anchor="middle" font-size="12" fill="#bfc0c0">province, dates,</text><text x="120.0" y="86" text-anchor="middle" font-size="12" fill="#bfc0c0">act types, sectors</text>
<rect x="264" y="24" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="360.0" y="53" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Queued job</text><text x="360.0" y="70" text-anchor="middle" font-size="12" fill="#bfc0c0">each business day,</text><text x="360.0" y="86" text-anchor="middle" font-size="12" fill="#bfc0c0">stops if cancelled</text>
<rect x="504" y="24" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="600.0" y="53" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Daily BORME index</text><text x="600.0" y="70" text-anchor="middle" font-size="12" fill="#bfc0c0">finds the PDFs for</text><text x="600.0" y="86" text-anchor="middle" font-size="12" fill="#bfc0c0">Galician provinces</text>
<rect x="744" y="24" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="840.0" y="53" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Download PDFs</text><text x="840.0" y="70" text-anchor="middle" font-size="12" fill="#bfc0c0">in parallel, reusing</text><text x="840.0" y="86" text-anchor="middle" font-size="12" fill="#bfc0c0">files on disk</text>
<rect x="744" y="168" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="840.0" y="197" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Extract text</text><text x="840.0" y="214" text-anchor="middle" font-size="12" fill="#bfc0c0">split into</text><text x="840.0" y="230" text-anchor="middle" font-size="12" fill="#bfc0c0">single notices</text>
<rect x="504" y="168" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="600.0" y="197" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Classify and parse</text><text x="600.0" y="214" text-anchor="middle" font-size="12" fill="#bfc0c0">keywords for the act,</text><text x="600.0" y="230" text-anchor="middle" font-size="12" fill="#bfc0c0">regex for the fields</text>
<rect x="264" y="168" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="360.0" y="197" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Filter</text><text x="360.0" y="214" text-anchor="middle" font-size="12" fill="#bfc0c0">act type, and CNAE</text><text x="360.0" y="230" text-anchor="middle" font-size="12" fill="#bfc0c0">or sector keyword</text>
<rect x="24" y="168" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="120.0" y="197" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Deduplicate and store</text><text x="120.0" y="214" text-anchor="middle" font-size="12" fill="#bfc0c0">tax ID, or name and</text><text x="120.0" y="230" text-anchor="middle" font-size="12" fill="#bfc0c0">municipality</text>
<rect x="24" y="344" width="192" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="120.0" y="373" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Company record</text><text x="120.0" y="390" text-anchor="middle" font-size="12" fill="#bfc0c0">phone number</text><text x="120.0" y="406" text-anchor="middle" font-size="12" fill="#bfc0c0">added by hand</text>
<polygon points="384,308 512,384 384,460 256,384" fill="#393e53" stroke="#f08a59" stroke-width="2"/><text x="384" y="364" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5">Daily at 07:30:</text><text x="384" y="380" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5">10 months old today,</text><text x="384" y="396" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5">pending, phone,</text><text x="384" y="412" text-anchor="middle" font-size="12" font-weight="600" fill="#f5f5f5">no calls yet?</text>
<rect x="600" y="344" width="152" height="80" rx="6" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="676.0" y="381" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Schedule call</text><text x="676.0" y="398" text-anchor="middle" font-size="12" fill="#bfc0c0">today at 09:00</text>
<rect x="800" y="344" width="136" height="80" rx="20" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="868.0" y="381" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Call agenda</text><text x="868.0" y="398" text-anchor="middle" font-size="12" fill="#bfc0c0">log the outcome</text>
<rect x="304" y="496" width="160" height="48" rx="20" fill="#393e53" stroke="#8791a6" stroke-width="1.2"/><text x="384.0" y="525" text-anchor="middle" font-size="14" font-weight="600" fill="#f5f5f5">Not scheduled</text>
<text x="504" y="516" font-size="12" fill="#b4bccb">A manual command can also import every company,</text>
<text x="504" y="536" font-size="12" fill="#b4bccb">without the filter step.</text>
</svg>
